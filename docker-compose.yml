name: jmesa-novabill-demo
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novabill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      POSTGRES_DB: ${POSTGRES_DB:-novabill_demo}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  init:
    build: .
    image: jmesa-novabill-demo:local
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed']
    environment: &api-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-novabill}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-novabill_demo}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Run npm run setup first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      API_PORT: 4000
    depends_on:
      db:
        condition: service_healthy
  api:
    image: jmesa-novabill-demo:local
    environment: *api-env
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    image: jmesa-novabill-demo:local
    command: ['npm', 'run', 'start', '-w', 'apps/web']
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
