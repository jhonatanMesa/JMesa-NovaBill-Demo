name: Quality & Docker E2E
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: novabill
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: novabill_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U novabill -d novabill_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://novabill:ci_ephemeral_only@127.0.0.1:5432/novabill_test?schema=public
      APP_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate isolated local configuration
        run: |
          npm run setup
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET=' + require('node:crypto').randomBytes(48).toString('hex') + '\n')"
      - name: Prisma generation, migrations and repeatable seed
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          npm run db:seed
      - name: Lint, types, formatting and secret scan
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
          npm run check:secrets
      - name: Unit and PostgreSQL integration tests
        run: |
          npm test
          npm run test:integration
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and start Docker Compose
        env:
          DB_PORT: '5433'
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait --wait-timeout 180
      - name: Browser E2E against Docker
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: |
            playwright-report/
            test-results/
      - name: Container logs on failure
        if: failure()
        run: if [ -f .env ]; then docker compose logs --tail 100; fi
      - name: Stop containers
        if: always()
        run: if [ -f .env ]; then docker compose down; fi
